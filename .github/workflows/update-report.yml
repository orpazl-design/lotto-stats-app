name: פרסום דוח הלוטו ל-Pages

# אתר מפעל הפיס חוסם גישה ממחוץ לישראל, אז ה-fetch/build לא יכולים לרוץ
# בענן של GitHub - הם רצים מקומית (Task Scheduler) והתוצאה נדחפת לכאן.
# ה-workflow הזה רק מפרסם את report.html שכבר קיים ב-repo ל-GitHub Pages,
# בכל פעם שהוא משתנה.
on:
  push:
    branches: [master]
    paths:
      - "report.html"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare Pages content
        run: |
          mkdir -p _site
          cp report.html _site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - id: deployment
        uses: actions/deploy-pages@v4
